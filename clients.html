<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krovos — Clients</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="mark">K</div><h2>Krovos</h2></div>
    <div class="sidebar-user">
      <div class="role-pill" id="sideRole"></div>
      <div class="uname" id="sideName"></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item" onclick="location.href='dashboard.html'"><span class="icon">📊</span> Dashboard</div>
      <div class="nav-item" onclick="location.href='workflow.html'"><span class="icon">⚡</span> Daily Workflow</div>
      <div class="nav-item active"><span class="icon">👥</span> Clients</div>
      <div class="nav-item" onclick="location.href='tasks.html'"><span class="icon">✅</span> Tasks</div>
      <div class="nav-item" onclick="location.href='search.html'"><span class="icon">🔍</span> Search</div>
      <div class="nav-item" onclick="location.href='constitution.html'"><span class="icon">📜</span> Constitution</div>
      <div class="nav-item board-only" onclick="location.href='officers.html'" style="display:none"><span class="icon">🏛️</span> Officers</div>
    </nav>
    <div class="sidebar-bottom"><button class="btn-outline" style="width:100%" onclick="auth.logout()">Logout</button></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Clients</h1>
      <button class="btn-outline" onclick="openModal()">+ Add Client</button>
    </div>

    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Client ID, নাম, বা কোম্পানি দিয়ে খুঁজুন..." oninput="filterClients()" />
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Client ID</th>
            <th>নাম</th>
            <th>কোম্পানি</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Added</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="clientTable"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Add Client Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>New Client Add করুন</h2>
    <div class="form-group">
      <label>নাম *</label>
      <input type="text" id="cName" placeholder="Client-এর নাম" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="cEmail" placeholder="email@example.com" />
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input type="text" id="cPhone" placeholder="01XXXXXXXXX" />
    </div>
    <div class="form-group">
      <label>কোম্পানি</label>
      <input type="text" id="cCompany" placeholder="কোম্পানির নাম" />
    </div>
    <div class="form-group">
      <label>Password (Client Login) *</label>
      <input type="text" id="cPassword" placeholder="Client-কে দেওয়ার জন্য password" />
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="cNotes" placeholder="কোনো বিশেষ তথ্য..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="width:auto;padding:10px 24px" onclick="addClient()">Add Client</button>
    </div>
  </div>
</div>

<!-- Client Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal" style="max-width:600px">
    <div id="detailContent"></div>
    <div class="modal-footer">
      <button class="btn-outline" onclick="closeDetail()">Close</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
const user = auth.require();
if (user.role === 'CLIENT') window.location.href = 'client-dashboard.html';
const color = ROLE_COLORS[user.role] || '#4f7fff';
document.getElementById('sideRole').textContent = user.role;
document.getElementById('sideRole').style.cssText = `background:${color}22;color:${color}`;
document.getElementById('sideName').textContent = user.name;
if (user.role === 'BOARD') document.querySelectorAll('.board-only').forEach(el => el.style.display = 'flex');

let allClients = [];

function genUserId() {
  return 'KRV-' + Date.now().toString(36).toUpperCase();
}

async function loadClients() {
  const filter = (user.role === 'BOARD' || user.role === 'CEO') ? '' : `assigned_role=eq.${user.role}`;
  allClients = await db.query('clients', { filter, order: 'created_at.desc' }) || [];
  renderTable(allClients);
}

function renderTable(clients) {
  const tbody = document.getElementById('clientTable');
  if (clients.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">কোনো client নেই। নতুন add করুন।</td></tr>';
    return;
  }
  tbody.innerHTML = clients.map(c => `
    <tr>
      <td><span class="client-id">${c.user_id}</span></td>
      <td><strong>${c.name}</strong></td>
      <td>${c.company || '—'}</td>
      <td>${c.phone || '—'}</td>
      <td><span class="badge badge-${c.status}">${c.status}</span></td>
      <td style="color:var(--muted)">${new Date(c.created_at).toLocaleDateString('bn-BD')}</td>
      <td>
        <button class="btn-sm btn-primary" onclick="viewClient('${c.id}')">Details</button>
      </td>
    </tr>
  `).join('');
}

function filterClients() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allClients.filter(c =>
    c.user_id.toLowerCase().includes(q) ||
    c.name.toLowerCase().includes(q) ||
    (c.company || '').toLowerCase().includes(q) ||
    (c.phone || '').includes(q)
  );
  renderTable(filtered);
}

async function addClient() {
  const name = document.getElementById('cName').value.trim();
  const password = document.getElementById('cPassword').value.trim();
  if (!name) return alert('নাম দিন।');
  if (!password) return alert('Client Login Password দিন।');
  const userId = genUserId();
  const data = {
    user_id: userId,
    name,
    email: document.getElementById('cEmail').value.trim(),
    phone: document.getElementById('cPhone').value.trim(),
    company: document.getElementById('cCompany').value.trim(),
    notes: document.getElementById('cNotes').value.trim(),
    password,
    assigned_role: user.role,
    added_by: user.id,
    status: 'active'
  };

  await db.insert('clients', data);
  await db.insert('activity_log', {
    officer_id: user.id,
    action: 'client_added',
    details: `New client added: ${name} (${userId})`
  });

  closeModal();
  loadClients();
  alert(`Client তৈরি হয়েছে!\n\nLogin ID: ${userId}\nPassword: ${password}\n\nএই তথ্য client-কে দিয়ে দিন।`);
}

async function viewClient(id) {
  const client = allClients.find(c => c.id === id);
  if (!client) return;

  const tasks = await db.query('tasks', { filter: `client_id=eq.${id}`, order: 'created_at.desc' }) || [];
  const logs = await db.query('activity_log', { filter: `client_id=eq.${id}`, order: 'created_at.desc', limit: 10 }) || [];

  document.getElementById('detailContent').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div>
        <h2 style="font-size:20px">${client.name}</h2>
        <span class="client-id">${client.user_id}</span>
      </div>
      <span class="badge badge-${client.status}">${client.status}</span>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
      <div style="background:var(--surface2);padding:14px;border-radius:10px">
        <div style="color:var(--muted);font-size:11px;margin-bottom:4px">Email</div>
        <div style="font-size:13px">${client.email || '—'}</div>
      </div>
      <div style="background:var(--surface2);padding:14px;border-radius:10px">
        <div style="color:var(--muted);font-size:11px;margin-bottom:4px">Phone</div>
        <div style="font-size:13px">${client.phone || '—'}</div>
      </div>
      <div style="background:var(--surface2);padding:14px;border-radius:10px">
        <div style="color:var(--muted);font-size:11px;margin-bottom:4px">কোম্পানি</div>
        <div style="font-size:13px">${client.company || '—'}</div>
      </div>
      <div style="background:var(--surface2);padding:14px;border-radius:10px">
        <div style="color:var(--muted);font-size:11px;margin-bottom:4px">Added</div>
        <div style="font-size:13px">${new Date(client.created_at).toLocaleDateString('bn-BD')}</div>
      </div>
    </div>

    ${client.notes ? `<div style="background:var(--surface2);padding:14px;border-radius:10px;margin-bottom:20px">
      <div style="color:var(--muted);font-size:11px;margin-bottom:4px">Notes</div>
      <div style="font-size:13px">${client.notes}</div>
    </div>` : ''}

    <div style="font-size:14px;font-weight:600;margin-bottom:12px">Tasks (${tasks.length})</div>
    ${tasks.length === 0 ? '<div class="empty">কোনো task নেই</div>' :
      tasks.slice(0,5).map(t => `
        <div style="background:var(--surface2);padding:12px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:13px">${t.title}</span>
          <span class="badge badge-${t.status}">${t.status}</span>
        </div>
      `).join('')
    }

    <div style="font-size:14px;font-weight:600;margin:16px 0 12px">Activity Log</div>
    ${logs.length === 0 ? '<div class="empty">কোনো activity নেই</div>' :
      logs.map(l => `
        <div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)">
          ${l.action} — ${new Date(l.created_at).toLocaleString('bn-BD')}
          ${l.details ? `<br><span style="color:var(--text)">${l.details}</span>` : ''}
        </div>
      `).join('')
    }
  `;

  document.getElementById('detailModal').classList.add('open');
}

function openModal() { document.getElementById('addModal').classList.add('open'); }
function closeModal() { document.getElementById('addModal').classList.remove('open'); }
function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }

loadClients();
</script>
</body>
</html>
