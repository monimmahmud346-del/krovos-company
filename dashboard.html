<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krovos — Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="mark">K</div>
      <h2>Krovos</h2>
    </div>
    <div class="sidebar-user">
      <div class="role-pill" id="sideRole"></div>
      <div class="uname" id="sideName"></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" onclick="goTo('dashboard.html')">
        <span class="icon">📊</span> Dashboard
      </div>
      <div class="nav-item" onclick="goTo('workflow.html')">
        <span class="icon">⚡</span> Daily Workflow
      </div>
      <div class="nav-item" onclick="goTo('clients.html')">
        <span class="icon">👥</span> Clients
      </div>
      <div class="nav-item" onclick="goTo('tasks.html')">
        <span class="icon">✅</span> Tasks
      </div>
      <div class="nav-item" onclick="goTo('search.html')">
        <span class="icon">🔍</span> Search
      </div>
      <div class="nav-item" onclick="goTo('constitution.html')">
        <span class="icon">📜</span> Constitution
      </div>
      <div class="nav-item board-only" onclick="goTo('officers.html')" style="display:none">
        <span class="icon">🏛️</span> Officers
      </div>
    </nav>
    <div class="sidebar-bottom">
      <button class="btn-outline" style="width:100%" onclick="auth.logout()">Logout</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div>
        <h1>Dashboard</h1>
        <div style="color:var(--muted);font-size:13px;margin-top:2px" id="dateStr"></div>
      </div>
      <div class="topbar-right">
        <button class="btn-outline" onclick="goTo('tasks.html')">+ New Task</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="cards-grid" id="statsGrid"></div>

    <!-- My Responsibilities -->
    <div class="section-title">আমার দায়িত্বসমূহ</div>
    <div class="table-wrap" style="margin-bottom:24px">
      <div id="respList" style="padding:16px 20px; display:flex; flex-wrap:wrap; gap:10px;"></div>
    </div>

    <!-- Today's Tasks -->
    <div class="table-wrap">
      <div class="table-head">
        <h3>আজকের Tasks</h3>
        <button class="btn-sm btn-primary" onclick="goTo('tasks.html')">সব দেখুন</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Task</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Due</th>
          </tr>
        </thead>
        <tbody id="todayTasks"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script>
const user = auth.require();
if (user.role === 'CLIENT') window.location.href = 'client-dashboard.html';
const color = ROLE_COLORS[user.role] || '#4f7fff';

// Sidebar user info
document.getElementById('sideRole').textContent = user.role;
document.getElementById('sideRole').style.background = color + '22';
document.getElementById('sideRole').style.color = color;
document.getElementById('sideName').textContent = user.name;

// Board only nav
if (user.role === 'BOARD') {
  document.querySelectorAll('.board-only').forEach(el => el.style.display = 'flex');
}

// Date
document.getElementById('dateStr').textContent = new Date().toLocaleDateString('bn-BD', {
  weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
});

function goTo(page) { window.location.href = page; }

async function loadDashboard() {
  // Stats
  const roleFilter = (user.role === 'BOARD' || user.role === 'CEO') ? '' : `assigned_role=eq.${user.role}`;
  const [tasks, clients] = await Promise.all([
    db.query('tasks', { filter: roleFilter }),
    db.query('clients', { filter: roleFilter })
  ]);

  const pending = (tasks || []).filter(t => t.status === 'pending').length;
  const inProgress = (tasks || []).filter(t => t.status === 'in_progress').length;
  const completed = (tasks || []).filter(t => t.status === 'completed').length;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card">
      <div class="label">মোট Tasks</div>
      <div class="value" style="color:${color}">${(tasks||[]).length}</div>
    </div>
    <div class="stat-card">
      <div class="label">Pending</div>
      <div class="value" style="color:#f59e0b">${pending}</div>
    </div>
    <div class="stat-card">
      <div class="label">In Progress</div>
      <div class="value" style="color:#3b82f6">${inProgress}</div>
    </div>
    <div class="stat-card">
      <div class="label">Completed</div>
      <div class="value" style="color:#10b981">${completed}</div>
    </div>
    <div class="stat-card">
      <div class="label">Clients</div>
      <div class="value" style="color:${color}">${(clients||[]).length}</div>
    </div>
  `;

  // Responsibilities
  const resps = ROLE_RESPONSIBILITIES[user.role] || [];
  document.getElementById('respList').innerHTML = resps.map(r =>
    `<span style="background:${color}22;color:${color};padding:6px 14px;border-radius:20px;font-size:13px;">${r}</span>`
  ).join('');

  // Today tasks
  const today = new Date().toISOString().split('T')[0];
  const todayTasks = (tasks || []).filter(t => t.due_date === today || t.status === 'in_progress').slice(0, 8);
  const tbody = document.getElementById('todayTasks');
  if (todayTasks.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">আজকের কোনো task নেই</td></tr>';
  } else {
    tbody.innerHTML = todayTasks.map(t => `
      <tr>
        <td>${t.title}</td>
        <td><span class="badge badge-${t.priority}">${t.priority}</span></td>
        <td><span class="badge badge-${t.status}">${t.status.replace('_',' ')}</span></td>
        <td style="color:var(--muted)">${t.due_date || '—'}</td>
      </tr>
    `).join('');
  }
}

loadDashboard();
</script>
</body>
</html>
