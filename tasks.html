<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krovos — Tasks</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="mark">K</div><h2>Krovos</h2></div>
    <div class="sidebar-user">
      <div class="role-pill" id="sideRole"></div>
      <div class="uname" id="sideName"></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item" onclick="location.href='dashboard.html'"><span class="icon">📊</span> Dashboard</div>
      <div class="nav-item" onclick="location.href='workflow.html'"><span class="icon">⚡</span> Daily Workflow</div>
      <div class="nav-item" onclick="location.href='clients.html'"><span class="icon">👥</span> Clients</div>
      <div class="nav-item active"><span class="icon">✅</span> Tasks</div>
      <div class="nav-item" onclick="location.href='search.html'"><span class="icon">🔍</span> Search</div>
      <div class="nav-item" onclick="location.href='constitution.html'"><span class="icon">📜</span> Constitution</div>
      <div class="nav-item board-only" onclick="location.href='officers.html'" style="display:none"><span class="icon">🏛️</span> Officers</div>
    </nav>
    <div class="sidebar-bottom"><button class="btn-outline" style="width:100%" onclick="auth.logout()">Logout</button></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Tasks</h1>
      <button class="btn-outline" onclick="openModal()">+ New Task</button>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="filterByStatus('all', this)">সব</div>
      <div class="tab" onclick="filterByStatus('pending', this)">Pending</div>
      <div class="tab" onclick="filterByStatus('in_progress', this)">In Progress</div>
      <div class="tab" onclick="filterByStatus('completed', this)">Completed</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Task</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Due Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="taskTable"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Add Task Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>New Task</h2>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="tTitle" placeholder="Task-এর বিবরণ" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="tDesc" placeholder="বিস্তারিত..."></textarea>
    </div>
    <div class="form-group">
      <label>Priority</label>
      <select id="tPriority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
        <option value="urgent">Urgent</option>
      </select>
    </div>
    <div class="form-group">
      <label>Client (ঐচ্ছিক)</label>
      <select id="tClient"><option value="">— কোনো client না —</option></select>
    </div>
    <div class="form-group">
      <label>Due Date</label>
      <input type="date" id="tDue" />
    </div>
    <div class="modal-footer">
      <button class="btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="width:auto;padding:10px 24px" onclick="addTask()">Add Task</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
const user = auth.require();
const color = ROLE_COLORS[user.role] || '#4f7fff';
document.getElementById('sideRole').textContent = user.role;
document.getElementById('sideRole').style.cssText = `background:${color}22;color:${color}`;
document.getElementById('sideName').textContent = user.name;
if (user.role === 'BOARD') document.querySelectorAll('.board-only').forEach(el => el.style.display = 'flex');

let allTasks = [];
let currentFilter = 'all';
let clientMap = {};

async function loadClientOptions() {
  const filter = (user.role === 'BOARD' || user.role === 'CEO') ? '' : `assigned_role=eq.${user.role}`;
  const clients = await db.query('clients', { filter }) || [];
  clientMap = Object.fromEntries(clients.map(c => [c.id, c]));
  const sel = document.getElementById('tClient');
  clients.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = `${c.name} (${c.user_id})`;
    sel.appendChild(opt);
  });
}

async function loadTasks() {
  const filter = (user.role === 'BOARD' || user.role === 'CEO') ? '' : `assigned_role=eq.${user.role}`;
  allTasks = await db.query('tasks', { filter, order: 'created_at.desc' }) || [];
  renderTasks();
}

function renderTasks() {
  const tasks = currentFilter === 'all' ? allTasks : allTasks.filter(t => t.status === currentFilter);
  const tbody = document.getElementById('taskTable');
  if (tasks.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">কোনো task নেই</td></tr>';
    return;
  }
  tbody.innerHTML = tasks.map(t => `
    <tr>
      <td>
        <div style="font-weight:500">${t.title}</div>
        ${t.client_id && clientMap[t.client_id] ? `<div style="color:var(--accent);font-size:11px;margin-top:2px">👤 ${clientMap[t.client_id].name}</div>` : ''}
        ${t.description ? `<div style="color:var(--muted);font-size:12px;margin-top:2px">${t.description.substring(0,60)}...</div>` : ''}
      </td>
      <td><span class="badge badge-${t.priority}">${t.priority}</span></td>
      <td>
        <select class="status-sel" onchange="updateStatus('${t.id}', this.value)" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px;font-size:12px;font-family:Inter,sans-serif">
          <option value="pending" ${t.status==='pending'?'selected':''}>Pending</option>
          <option value="in_progress" ${t.status==='in_progress'?'selected':''}>In Progress</option>
          <option value="completed" ${t.status==='completed'?'selected':''}>Completed</option>
          <option value="cancelled" ${t.status==='cancelled'?'selected':''}>Cancelled</option>
        </select>
      </td>
      <td style="color:var(--muted)">${t.due_date || '—'}</td>
      <td>
        <button class="btn-sm" style="background:var(--danger);color:white" onclick="deleteTask('${t.id}')">Delete</button>
      </td>
    </tr>
  `).join('');
}

function filterByStatus(status, el) {
  currentFilter = status;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

async function updateStatus(id, status) {
  await db.update('tasks', id, { status, completed_at: status === 'completed' ? new Date().toISOString() : null });
  await loadTasks();
}

async function deleteTask(id) {
  if (!confirm('এই task delete করবেন?')) return;
  await db.delete('tasks', id);
  loadTasks();
}

async function addTask() {
  const title = document.getElementById('tTitle').value.trim();
  if (!title) return alert('Title দিন।');

  await db.insert('tasks', {
    title,
    description: document.getElementById('tDesc').value.trim(),
    priority: document.getElementById('tPriority').value,
    due_date: document.getElementById('tDue').value || null,
    client_id: document.getElementById('tClient').value || null,
    assigned_role: user.role,
    created_by: user.id,
    assigned_to: user.id,
    status: 'pending'
  });

  closeModal();
  loadTasks();
}

function openModal() { document.getElementById('addModal').classList.add('open'); }
function closeModal() { document.getElementById('addModal').classList.remove('open'); }

loadClientOptions();
loadTasks();
</script>
</body>
</html>
