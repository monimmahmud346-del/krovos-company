<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krovos — Constitution</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="mark">K</div><h2>Krovos</h2></div>
    <div class="sidebar-user">
      <div class="role-pill" id="sideRole"></div>
      <div class="uname" id="sideName"></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item" onclick="location.href='dashboard.html'"><span class="icon">📊</span> Dashboard</div>
      <div class="nav-item" onclick="location.href='workflow.html'"><span class="icon">⚡</span> Daily Workflow</div>
      <div class="nav-item" onclick="location.href='clients.html'"><span class="icon">👥</span> Clients</div>
      <div class="nav-item" onclick="location.href='tasks.html'"><span class="icon">✅</span> Tasks</div>
      <div class="nav-item" onclick="location.href='search.html'"><span class="icon">🔍</span> Search</div>
      <div class="nav-item active"><span class="icon">📜</span> Constitution</div>
      <div class="nav-item board-only" onclick="location.href='officers.html'" style="display:none"><span class="icon">🏛️</span> Officers</div>
    </nav>
    <div class="sidebar-bottom"><button class="btn-outline" style="width:100%" onclick="auth.logout()">Logout</button></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Constitution & Documents</h1>
      <button class="btn-outline" id="addDocBtn" onclick="openModal()" style="display:none">+ Add Document</button>
    </div>

    <div id="docList"></div>

    <!-- View Modal -->
    <div class="modal-overlay" id="viewModal">
      <div class="modal" style="max-width:700px">
        <h2 id="docTitle" style="margin-bottom:16px"></h2>
        <div id="docContent" style="white-space:pre-wrap;font-size:14px;line-height:1.8;color:var(--text);max-height:60vh;overflow-y:auto;background:var(--surface2);padding:20px;border-radius:10px"></div>
        <div class="modal-footer">
          <button class="btn-outline" onclick="closeView()">Close</button>
        </div>
      </div>
    </div>

    <!-- Add Modal (BOARD only) -->
    <div class="modal-overlay" id="addModal">
      <div class="modal">
        <h2>Document Add করুন</h2>
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="dTitle" placeholder="Document-এর নাম" />
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="dType">
            <option value="constitution">Constitution</option>
            <option value="policy">Policy</option>
            <option value="guideline">Guideline</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Content (text)</label>
          <textarea id="dContent" style="min-height:200px" placeholder="Document-এর content এখানে paste করুন..."></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn-outline" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" style="width:auto;padding:10px 24px" onclick="addDoc()">Save</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script>
const user = auth.require();
if (user.role === 'CLIENT') window.location.href = 'client-dashboard.html';
const color = ROLE_COLORS[user.role] || '#4f7fff';
document.getElementById('sideRole').textContent = user.role;
document.getElementById('sideRole').style.cssText = `background:${color}22;color:${color}`;
document.getElementById('sideName').textContent = user.name;
if (user.role === 'BOARD') {
  document.querySelectorAll('.board-only').forEach(el => el.style.display = 'flex');
  document.getElementById('addDocBtn').style.display = 'block';
}

const TYPE_COLORS = {
  constitution: '#4f7fff', policy: '#f59e0b',
  guideline: '#10b981', other: '#6b7280'
};

async function loadDocs() {
  const docs = await db.query('documents', { order: 'created_at.desc' }) || [];
  const area = document.getElementById('docList');

  if (docs.length === 0) {
    area.innerHTML = '<div class="empty" style="margin-top:60px">কোনো document নেই।<br><span style="font-size:12px">Board Admin document add করতে পারবেন।</span></div>';
    return;
  }

  area.innerHTML = docs.map(d => {
    const tc = TYPE_COLORS[d.doc_type] || '#6b7280';
    return `
      <div class="table-wrap" style="margin-bottom:16px;cursor:pointer" onclick="viewDoc('${d.id}')">
        <div style="padding:20px;display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:14px">
            <div style="width:44px;height:44px;background:${tc}22;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px">📜</div>
            <div>
              <div style="font-weight:600;font-size:15px">${d.title}</div>
              <div style="color:var(--muted);font-size:12px;margin-top:3px">${new Date(d.created_at).toLocaleDateString('bn-BD')}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="background:${tc}22;color:${tc};padding:4px 12px;border-radius:12px;font-size:11px;font-weight:600">${d.doc_type}</span>
            <span style="color:var(--muted);font-size:13px">→</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

let allDocs = [];
async function viewDoc(id) {
  if (!allDocs.length) allDocs = await db.query('documents', {}) || [];
  const doc = allDocs.find(d => d.id === id);
  if (!doc) return;
  document.getElementById('docTitle').textContent = doc.title;
  document.getElementById('docContent').textContent = doc.content || 'Content নেই।';
  document.getElementById('viewModal').classList.add('open');
}

async function addDoc() {
  const title = document.getElementById('dTitle').value.trim();
  if (!title) return alert('Title দিন।');
  await db.insert('documents', {
    title,
    doc_type: document.getElementById('dType').value,
    content: document.getElementById('dContent').value.trim(),
    uploaded_by: user.id
  });
  closeModal();
  loadDocs();
}

function openModal() { document.getElementById('addModal').classList.add('open'); }
function closeModal() { document.getElementById('addModal').classList.remove('open'); }
function closeView() { document.getElementById('viewModal').classList.remove('open'); }

loadDocs();
</script>
</body>
</html>
