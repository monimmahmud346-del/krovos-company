<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krovos — Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="mark">K</div>
      <h1>Krovos</h1>
      <p>Company Operating System</p>
    </div>

    <div class="error-msg" id="errMsg"></div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="your@krovos.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>

    <button class="btn btn-primary" onclick="doLogin()">Sign In</button>
  </div>
</div>

<script src="js/config.js"></script>
<script>
// Simple password check (plain text for demo — upgrade to bcrypt on server later)
const OFFICERS = [
  { email: 'board@krovos.com', password: 'krovos2024', role: 'BOARD', name: 'Board Admin' },
];

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('errMsg');
  err.style.display = 'none';

  if (!email || !password) {
    err.textContent = 'Email ও Password দিন।';
    err.style.display = 'block';
    return;
  }

  try {
    // Check against database
    const officers = await db.query('officers', {
      filter: `email=eq.${encodeURIComponent(email)}`
    });

    if (!officers || officers.length === 0) {
      err.textContent = 'Email পাওয়া যায়নি।';
      err.style.display = 'block';
      return;
    }

    const officer = officers[0];

    // Simple password check (plain text stored for demo)
    // For production: use Supabase Auth
    if (officer.plain_password && officer.plain_password !== password) {
      err.textContent = 'Password ভুল।';
      err.style.display = 'block';
      return;
    }

    // Fallback: hardcoded check for board admin
    if (email === 'board@krovos.com' && password !== 'krovos2024') {
      err.textContent = 'Password ভুল।';
      err.style.display = 'block';
      return;
    }

    auth.login(officer);
    window.location.href = 'dashboard.html';
  } catch(e) {
    err.textContent = 'Connection error। আবার try করুন।';
    err.style.display = 'block';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// Redirect if already logged in
if (auth.current()) window.location.href = 'dashboard.html';
</script>
</body>
</html>
