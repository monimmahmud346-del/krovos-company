<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krovos — Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="mark">K</div>
      <h1>Krovos</h1>
      <p>Company Operating System</p>
    </div>
    <div class="error-msg" id="errMsg"></div>
    <div class="form-group">
      <label>Email / Client ID</label>
      <input type="text" id="email" placeholder="your@krovos.com অথবা KRV-XXXXXX" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>
    <button class="btn btn-primary" onclick="doLogin()">Sign In</button>
  </div>
</div>
<script src="js/config.js"></script>
<script>
async function doLogin() {
  const input = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('errMsg');
  err.style.display = 'none';

  if (!input || !password) {
    err.textContent = 'Email/Client ID ও Password দিন।';
    err.style.display = 'block';
    return;
  }

  try {
    // Hardcoded Board Admin fallback
    if (input === 'board@krovos.com' && password === 'krovos2024') {
      auth.login({ id: 'board-admin', name: 'Board Admin', email: input, role: 'BOARD' });
      window.location.href = 'dashboard.html';
      return;
    }

    // 1) Officer login (by email)
    const officers = await db.query('officers', { filter: `email=eq.${encodeURIComponent(input)}` });
    if (officers && officers.length > 0) {
      const officer = officers[0];
      if (officer.password_hash !== password) {
        err.textContent = 'Password ভুল।';
        err.style.display = 'block';
        return;
      }
      auth.login(officer);
      window.location.href = 'dashboard.html';
      return;
    }

    // 2) Client login (by Client ID অথবা email)
    let clientMatches = await db.query('clients', { filter: `user_id=eq.${encodeURIComponent(input)}` });
    if (!clientMatches || clientMatches.length === 0) {
      clientMatches = await db.query('clients', { filter: `email=eq.${encodeURIComponent(input)}` });
    }
    if (clientMatches && clientMatches.length > 0) {
      const client = clientMatches[0];
      if (client.password !== password) {
        err.textContent = 'Password ভুল।';
        err.style.display = 'block';
        return;
      }
      auth.login({ ...client, role: 'CLIENT' });
      window.location.href = 'client-dashboard.html';
      return;
    }

    err.textContent = 'Email/Client ID পাওয়া যায়নি।';
    err.style.display = 'block';

  } catch(e) {
    err.textContent = 'Connection error। আবার try করুন।';
    err.style.display = 'block';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

const cur = auth.current();
if (cur) window.location.href = cur.role === 'CLIENT' ? 'client-dashboard.html' : 'dashboard.html';
</script>
</body>
</html>
